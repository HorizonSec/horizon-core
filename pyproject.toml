[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "horizon-core"
version = "0.1.0"
description = "Shared utilities and framework for HorizonSec tools"
readme = "README.md"
requires-python = ">=3.9"
license = {file = "LICENSE"}
keywords = ["security", "cli", "sarif", "utilities"]
authors = [
    {name = "HorizonSec Team"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "pyyaml>=6.0.1",
]

[project.urls]
Homepage = "https://github.com/HorizonSec/horizon-core"
Repository = "https://github.com/HorizonSec/horizon-core"
Issues = "https://github.com/HorizonSec/horizon-core/issues"

[tool.hatch.build.targets.wheel]
packages = ["horizon_core"]

# ==============================================================================
# HATCH ENVIRONMENTS
# ==============================================================================
[tool.hatch.envs.default]
python = "3.13"
dependencies = [
  # Core dependencies
  "typer",
  "rich",
  "pyfiglet",
]

[tool.hatch.envs.dev]
python = "3.13"
dependencies = [
  # Core dependencies (needed for type checking)
  "typer",
  "rich",
  "pyfiglet",
  # Documentation
  "sphinx",
  "furo",
  "myst-parser", 
  # Code formatting and linting
  "black",
  "flake8",
  "flake8-pyproject",
  "isort",
  "mypy",
  # Testing
  "pytest",
  "coverage[toml]>=6.5",
  # Security
  "bandit",
]

[tool.hatch.envs.hatch-test]
dependencies = [
    "typer",
    "rich",
    "pyfiglet",
    "pytest",
    "pytest-cov",
]


# ==============================================================================
# HATCH SCRIPTS
# ==============================================================================

[tool.hatch.envs.default.scripts]
# Documentation scripts
docs = "sphinx-build -b html docs/source docs/build"
docs-clean = "sphinx-build -b html -E docs/source docs/build"
docs-serve = "python -m http.server 8000 --directory docs/build"

# Testing scripts
test = "pytest {args:tests}"
test-cov = "coverage run -m pytest {args:tests}"
cov-report = [
  "- coverage combine",
  "coverage report",
]
cov = [
  "test-cov",
  "cov-report",
]


[tool.hatch.envs.dev.scripts]
# Development scripts
isort = "python -m isort {args}"
black = "python -m black {args}"
flake8 = "python -m flake8 {args}"
mypy = "python -m mypy --exclude 'docs' {args}"

# Build scripts
build = "python -m build"
clean = "hatch clean"
format = [
  "isort horizon_core tests",
  "black horizon_core tests"
]
pre-build = [
  "isort horizon_core tests",
  "black --check horizon_core tests",
  "mypy horizon_core",
  "flake8 horizon_core tests",
  "bandit -r horizon_core"
]

[[tool.hatch.envs.all.matrix]]
python = ["3.9", "3.10", "3.11", "3.12", "3.13"]

# ==============================================================================
# TOOL CONFIGURATIONS
# ==============================================================================

[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311", "py312"]

[tool.isort]
profile = "black"
line_length = 100

[tool.flake8]
max-line-length = 100
extend-ignore = ["E203", "W503"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v"

[tool.coverage.run]
source = ["horizon_core"]
omit = ["*/tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B101"]  # Only skip assert_used if needed
confidence = "medium"
severity = "medium"
