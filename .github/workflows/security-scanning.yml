name: Security Scanning
permissions:
  contents: read
on:
  workflow_run:
    workflows: ["Full Build"]
    types:
      - completed
    branches:
      - mainline

jobs:
  securityScan:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    name: Run Security Scan on Code
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install hatch
      - name: Build the project
        run: hatch build
      - name: Run Bandit Scan
        run: hatch run dev:bandit -r ./horizon_core
      - name: Upload bandit report
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report-${{ matrix.python-version }}
          path: logs/
      - name: Add failure summary
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            core.summary.addHeading('❌ securityScan failed (Python ${{ matrix.python-version }})')
            core.summary.addRaw('Check logs and uploaded artifacts for details.')
            await core.summary.write()
